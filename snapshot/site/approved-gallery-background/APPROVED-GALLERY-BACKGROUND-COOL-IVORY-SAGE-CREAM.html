<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sanchia Hair — Plain Ombré Background Test Only</title>
<style>
  :root{
    --edge-deep-sage:#78846f;
    --soft-deep-sage:#8f9d86;
    --warm-sage:#aebca9;
    --soft-light-sage:#d8e1d1;
    --cream:#eef0e7;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100%;
    background:var(--cream);
  }
  body{overflow-x:hidden;}

  /*
    Background-only test page.
    No watermark. No logo. No wording. No oval. No circle.
    No side darkening. No layout. No boxes. No photos. No navigation.
  */
  .background-test{
    min-height:3200px;
    width:100%;
    background:linear-gradient(180deg,
      var(--edge-deep-sage) 0%,
      var(--soft-deep-sage) 7%,
      var(--warm-sage) 18%,
      var(--soft-light-sage) 31%,
      var(--cream) 41%,
      var(--cream) 59%,
      var(--soft-light-sage) 69%,
      var(--warm-sage) 82%,
      var(--soft-deep-sage) 93%,
      var(--edge-deep-sage) 100%
    );
  }
</style>
</head>
<body>
  <main class="background-test" aria-label="Plain horizontal-band ombré background test only"></main>
</body>
</html>
