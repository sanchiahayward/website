<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sanchia Hair — Clean Evie Foliage Playground</title>
  <style>
    :root{
      --sage:#c5d0bb;
      --sage-deep:#9faf91;
      --cream:#f6f0e7;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:linear-gradient(180deg,var(--sage),#d8dfcf 44%,var(--cream));}
    body{overflow-x:hidden;}
    .clean-evie-stage{
      position:relative;
      min-height:150vh;
      overflow:hidden;
      background:linear-gradient(180deg,rgba(197,208,187,.98),rgba(218,224,210,.86) 42%,rgba(246,240,231,.94));
    }
    .clean-evie-stage::before,
    .clean-evie-stage::after{
      content:"";
      position:absolute;
      top:0;
      bottom:0;
      width:clamp(76px,9vw,138px);
      background:
        linear-gradient(90deg,rgba(246,240,231,.64),rgba(246,240,231,.26) 48%,rgba(246,240,231,0)),
        url('assets/giving-back/plant-border-repeat-seam-soft-wide.png') center top/100% auto repeat-y;
      opacity:.36;
      mix-blend-mode:multiply;
      filter:saturate(.72) contrast(.82) blur(1.15px);
      pointer-events:none;
      z-index:2;
      -webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.50) 48%,rgba(0,0,0,.10) 78%,transparent 100%);
      mask-image:linear-gradient(90deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.50) 48%,rgba(0,0,0,.10) 78%,transparent 100%);
    }
    .clean-evie-stage::before{left:0;}
    .clean-evie-stage::after{right:0;transform:scaleX(-1);}
    .clean-evie-photo{
      position:relative;
      z-index:1;
      width:min(100vw,1280px);
      margin:0 auto;
      min-height:clamp(620px,78vw,1013px);
      display:flex;
      align-items:flex-start;
      justify-content:center;
    }
    .clean-evie-photo img{
      display:block;
      width:min(100vw,1280px);
      max-width:100%;
      height:auto;
      object-fit:contain;
      object-position:center top;
      filter:none;
      opacity:1;
    }
    .soft-bottom-fade{
      position:absolute;
      left:0;
      right:0;
      top:clamp(720px,78vw,1010px);
      height:60vh;
      z-index:3;
      pointer-events:none;
      background:linear-gradient(180deg,rgba(246,240,231,0),rgba(246,240,231,.42) 26%,rgba(246,240,231,.94) 76%);
    }
    @media(max-width:760px){
      .clean-evie-stage::before,
      .clean-evie-stage::after{width:clamp(52px,15vw,92px);opacity:.48;}
      .clean-evie-photo{min-height:clamp(440px,88vw,760px);}
      .soft-bottom-fade{top:clamp(470px,92vw,780px);}
    }
  </style>
</head>
<body>
  <main class="clean-evie-stage" aria-label="Clean Evie foliage playground">
    <div class="clean-evie-photo">
      <img src="assets/approved/APPROVED-Evie-green-fade-ear-paw-final.jpg" alt="">
    </div>
    <div class="soft-bottom-fade" aria-hidden="true"></div>
  </main>
</body>
</html>
