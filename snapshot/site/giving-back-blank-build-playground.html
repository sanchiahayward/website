<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sanchia Hair — Blank Giving Back Build Playground</title>
  <style>
    :root{
      --cream:#f6f0e7;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      min-height:100%;
      background:var(--cream);
    }
    body{overflow-x:hidden;}
    .blank-build-playground{
      min-height:160vh;
      background:var(--cream);
    }
    .picture-top-wrap{
      position:relative;
      width:100vw;
      margin:0;
      padding:0;
      line-height:0;
    }
    .picture-top-wrap::before{
      content:"";
      position:absolute;
      left:24%;
      right:24%;
      top:339px;
      height:22px;
      pointer-events:none;
      z-index:2;
      background:rgba(189,180,167,.195);
      filter:blur(4.05px);
      border-radius:999px;
    }
    .top-picture{
      display:block;
      width:100vw;
      max-width:none;
      height:auto;
      margin:0;
      padding:0;
      object-fit:cover;
      object-position:center top;
    }
    .side-foliage-area{
      display:none;
    }
  </style>
</head>
<body>
  <main class="blank-build-playground" aria-label="Blank Giving Back build playground">
    <div class="picture-top-wrap" aria-hidden="true">
      <img class="top-picture" src="assets/blank-playground/new-f1-protected-base.jpg" alt="">
    </div>
    <div class="side-foliage-area" aria-hidden="true"></div>
  </main>
</body>
</html>
