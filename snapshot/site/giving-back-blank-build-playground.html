<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sanchia Hair — Blank Giving Back Build Playground</title>
  <style>
    :root{
      --cream:#f6f0e7;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      min-height:100%;
      background:var(--cream);
    }
    body{overflow-x:hidden;}
    .blank-build-playground{
      min-height:160vh;
      background:var(--cream);
    }
    .picture-top-wrap{
      position:relative;
      width:100vw;
      margin:0;
      padding:0;
      line-height:0;
    }
    .picture-top-wrap::before{
      content:"";
      position:absolute;
      left:24%;
      right:24%;
      top:339px;
      height:22px;
      pointer-events:none;
      z-index:2;
      background:rgba(189,180,167,.195);
      filter:blur(4.05px);
      border-radius:999px;
    }
    .picture-top-wrap::after{
      content:"";
      position:absolute;
      top:305px;
      right:0;
      width:18%;
      height:calc(100% - 305px);
      pointer-events:none;
      z-index:1;
      background:linear-gradient(90deg,
        rgba(246,240,231,0) 0%,
        rgba(229,226,199,.08) 28%,
        rgba(217,224,194,.16) 62%,
        rgba(205,219,185,.24) 100%);
      mix-blend-mode:normal;
    }
    .bottom-corner-balance{
      position:absolute;
      top:312px;
      width:26%;
      height:110px;
      pointer-events:none;
      z-index:1;
      mix-blend-mode:normal;
      opacity:.94;
      filter:blur(2.5px);
    }
    .bottom-corner-balance.left{
      left:4%;
      background:radial-gradient(ellipse at 40% 42%,
        rgba(206,232,185,.37) 0%,
        rgba(219,236,199,.29) 34%,
        rgba(235,239,214,.13) 58%,
        rgba(246,240,231,0) 82%);
    }
    .bottom-corner-balance.right{
      right:4%;
      background:radial-gradient(ellipse at 60% 42%,
        rgba(206,232,185,.37) 0%,
        rgba(219,236,199,.29) 34%,
        rgba(235,239,214,.13) 58%,
        rgba(246,240,231,0) 82%);
    }
    .top-picture{
      display:block;
      width:100vw;
      max-width:none;
      height:auto;
      margin:0;
      padding:0;
      object-fit:cover;
      object-position:center top;
    }
    .side-foliage-area{
      display:none;
    }
  </style>
</head>
<body>
  <main class="blank-build-playground" aria-label="Blank Giving Back build playground">
    <div class="picture-top-wrap" aria-hidden="true">
      <img class="top-picture" src="assets/blank-playground/new-f1-protected-base.jpg" alt="">
      <span class="bottom-corner-balance left" aria-hidden="true"></span>
      <span class="bottom-corner-balance right" aria-hidden="true"></span>
    </div>
    <div class="side-foliage-area" aria-hidden="true"></div>
  </main>
</body>
</html>
