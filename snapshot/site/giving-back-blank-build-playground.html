<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sanchia Hair — Blank Giving Back Build Playground</title>
  <style>
    :root{
      --cream:#f6f0e7;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      min-height:100%;
      background:var(--cream);
    }
    body{overflow-x:hidden;}
    .blank-build-playground{
      min-height:160vh;
      background:var(--cream);
    }
    .picture-top-wrap{
      position:relative;
      width:100vw;
      margin:0;
      padding:0;
      line-height:0;
    }
    .picture-top-wrap::before{
      content:"";
      position:absolute;
      left:0;
      right:0;
      top:560px;
      height:88px;
      pointer-events:none;
      z-index:2;
      background:
        linear-gradient(180deg,rgba(158,174,149,0) 0%,rgba(158,174,149,.08) 20%,rgba(158,174,149,.26) 42%,rgba(158,174,149,.26) 58%,rgba(158,174,149,.08) 80%,rgba(158,174,149,0) 100%),
        linear-gradient(90deg,rgba(158,174,149,0) 0%,rgba(158,174,149,.22) 12%,rgba(158,174,149,.22) 88%,rgba(158,174,149,0) 100%);
      box-shadow:0 0 34px rgba(158,174,149,.16),0 12px 30px rgba(158,174,149,.08);
      filter:blur(1.8px);
      backdrop-filter:blur(1.5px);
    }
    .top-picture{
      display:block;
      width:100vw;
      max-width:none;
      height:auto;
      margin:0;
      padding:0;
      object-fit:cover;
      object-position:center top;
    }
    .side-foliage-area{
      display:none;
    }
  </style>
</head>
<body>
  <main class="blank-build-playground" aria-label="Blank Giving Back build playground">
    <div class="picture-top-wrap" aria-hidden="true">
      <img class="top-picture" src="assets/blank-playground/new-f1-protected-base.jpg" alt="">
    </div>
    <div class="side-foliage-area" aria-hidden="true"></div>
  </main>
</body>
</html>
