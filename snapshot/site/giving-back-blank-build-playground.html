<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sanchia Hair — Blank Giving Back Build Playground</title>
  <style>
    :root{
      --cream:#f6f0e7;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      min-height:100%;
      background:var(--cream);
    }
    body{overflow-x:hidden;}
    .blank-build-playground{
      min-height:160vh;
      background:var(--cream);
    }
  </style>
</head>
<body>
  <main class="blank-build-playground" aria-label="Blank Giving Back build playground"></main>
</body>
</html>
