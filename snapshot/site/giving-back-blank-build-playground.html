<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sanchia Hair — Blank Giving Back Build Playground</title>
  <style>
    :root{
      --cream:#f6f0e7;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      min-height:100%;
      background:var(--cream);
    }
    body{overflow-x:hidden;}
    .blank-build-playground{
      min-height:160vh;
      background:var(--cream);
    }
    .picture-top-wrap{
      position:relative;
      width:100vw;
      margin:0;
      padding:0;
      line-height:0;
    }
    .picture-top-wrap::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:-1px;
      height:clamp(38px,5.5vw,82px);
      pointer-events:none;
      background:linear-gradient(180deg,rgba(246,240,231,0) 0%,rgba(246,240,231,.42) 42%,var(--cream) 100%);
    }
    .top-picture{
      display:block;
      width:100vw;
      max-width:none;
      height:auto;
      margin:0;
      padding:0;
      object-fit:cover;
      object-position:center top;
    }
    .side-foliage-area{
      position:relative;
      width:100vw;
      min-height:160vh;
      background:var(--cream);
      overflow:hidden;
    }
    .side-foliage-area::before,
    .side-foliage-area::after{
      content:"";
      position:absolute;
      top:0;
      bottom:0;
      width:clamp(129px,18.02vw,260px);
      pointer-events:none;
      background:
        radial-gradient(ellipse at 35% 0%,rgba(171,184,158,.46) 0%,rgba(180,192,168,.30) 34%,rgba(197,208,187,.12) 64%,rgba(197,208,187,0) 100%),
        linear-gradient(90deg,rgba(246,240,231,.30),rgba(197,208,187,.24) 48%,rgba(197,208,187,0) 92%),
        url('assets/giving-back/plant-border-repeat-seam-soft-wide.png') center top/100% auto repeat-y;
      opacity:.68;
      filter:hue-rotate(14deg) saturate(.56) contrast(.86) brightness(1.10) blur(.16px);
      -webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,1) 0%,rgba(0,0,0,.92) 62%,rgba(0,0,0,.34) 88%,transparent 100%);
      mask-image:linear-gradient(90deg,rgba(0,0,0,1) 0%,rgba(0,0,0,.92) 62%,rgba(0,0,0,.34) 88%,transparent 100%);
    }
    .side-foliage-area::before{left:0;}
    .side-foliage-area::after{right:0;transform:scaleX(-1);}
    .green-line-cloud{
      position:absolute;
      top:-6px;
      width:clamp(118px,18.02vw,260px);
      height:clamp(78px,7.8vw,118px);
      pointer-events:none;
      z-index:2;
      opacity:1;
      filter:blur(8px) saturate(.9) contrast(.9) brightness(1.01);
      background:
        radial-gradient(ellipse at 50% 24%,rgba(111,134,100,.72) 0%,rgba(128,149,116,.62) 33%,rgba(145,163,132,.44) 58%,rgba(145,163,132,.18) 78%,rgba(145,163,132,0) 100%),
        linear-gradient(180deg,rgba(122,145,111,.50) 0%,rgba(142,161,129,.35) 52%,rgba(142,161,129,0) 100%);
    }
    .green-line-cloud--left{
      left:0;
      border-radius:0 48% 64% 0;
    }
    .green-line-cloud--right{
      right:0;
      border-radius:48% 0 0 64%;
      transform:scaleX(-1);
    }
  </style>
</head>
<body>
  <main class="blank-build-playground" aria-label="Blank Giving Back build playground">
    <div class="picture-top-wrap" aria-hidden="true">
      <img class="top-picture" src="assets/blank-playground/top-picture.jpg" alt="">
    </div>
    <div class="side-foliage-area" aria-hidden="true">
      <span class="green-line-cloud green-line-cloud--left"></span>
      <span class="green-line-cloud green-line-cloud--right"></span>
    </div>
  </main>
</body>
</html>
