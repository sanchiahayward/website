<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>iPad Preview Frame</title>
  <style>
    body{margin:0;background:#ece8df;font-family:Arial,sans-serif;display:grid;place-items:start center;min-height:100vh;padding:24px;box-sizing:border-box;}
    .label{font:700 12px/1 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;margin:0 0 12px;color:#151610;text-align:center;}
    .frame{width:820px;height:1180px;border:1px solid #151610;background:white;box-shadow:0 20px 60px rgba(0,0,0,.18);overflow:hidden;}
    iframe{width:820px;height:1180px;border:0;display:block;}
  </style>
</head>
<body>
  <div>
    <p class="label">iPad preview — template only</p>
    <div class="frame"><iframe src="template-horizontal-slideshow-story-v1.html?v=photo-box-narrow1"></iframe></div>
  </div>
</body>
</html>
