<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Header Navigation Template</title>
  <style>
    :root{
      --cream:#f6f0e7;
      --paper:#fbf8f1;
      --sage:#c7cec0;
      --sage-deep:#62675a;
      --olive:#3f5a2d;
      --ink:#1d1d1d;
      --soft-line:rgba(29,29,29,.16);
      --shadow:0 18px 60px rgba(40,48,36,.10);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--cream);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
    body{
      background:
        radial-gradient(circle at 8% 18%,rgba(98,103,90,.18),transparent 28%),
        radial-gradient(circle at 88% 8%,rgba(199,206,192,.38),transparent 30%),
        linear-gradient(180deg,var(--cream),#efe8dc);
    }
    .page{
      min-height:100vh;
      padding:28px clamp(14px,3vw,38px) 80px;
    }

    /* HEADER TEMPLATE */
    .announcement{
      min-height:34px;
      background:var(--ink);
      color:var(--paper);
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:7px 18px;
      font-size:12px;
      letter-spacing:.12em;
      text-transform:uppercase;
      border-bottom:4px solid var(--sage-deep);
    }
    .header-shell{
      position:sticky;
      top:0;
      z-index:10;
      width:min(1180px,100%);
      margin:0 auto;
      background:rgba(199,206,192,.92);
      backdrop-filter:blur(10px);
      border:1px solid rgba(98,103,90,.28);
      box-shadow:var(--shadow);
    }
    .main-bar{
      min-height:82px;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:18px;
      padding:16px clamp(18px,3vw,34px);
    }
    .left-actions,.right-actions{display:flex;align-items:center;gap:12px}
    .right-actions{justify-content:flex-end}
    .nav-pill{
      height:38px;
      min-width:92px;
      padding:0 18px;
      border:1px solid rgba(29,29,29,.34);
      background:rgba(246,240,231,.36);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:11px;
      letter-spacing:.15em;
      text-transform:uppercase;
    }
    .book-pill{
      background:var(--ink);
      color:var(--paper);
      border-color:var(--ink);
      min-width:120px;
    }
    .logo-mark{
      width:76px;
      height:76px;
      border:1px solid rgba(29,29,29,.32);
      border-radius:50%;
      background:
        radial-gradient(circle,rgba(251,248,241,.92) 0 38%,rgba(251,248,241,.35) 39% 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 10px 30px rgba(40,48,36,.08);
    }
    .logo-inner{
      width:36px;
      height:36px;
      border:1px solid rgba(29,29,29,.42);
      border-radius:50%;
      position:relative;
    }
    .logo-inner:before,.logo-inner:after{
      content:"";
      position:absolute;
      left:50%;top:50%;
      width:22px;height:1px;
      background:rgba(29,29,29,.55);
      transform:translate(-50%,-50%) rotate(34deg);
    }
    .logo-inner:after{transform:translate(-50%,-50%) rotate(-34deg)}

    .quick-row{
      display:flex;
      justify-content:center;
      gap:10px;
      padding:0 18px 16px;
      border-top:1px solid rgba(98,103,90,.22);
    }
    .quick-chip{
      height:32px;
      padding:0 14px;
      border:1px solid rgba(98,103,90,.36);
      background:rgba(251,248,241,.44);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:10px;
      letter-spacing:.13em;
      text-transform:uppercase;
      white-space:nowrap;
    }

    /* OPEN MENU TEMPLATE */
    .menu-panel{
      width:min(1180px,100%);
      margin:18px auto 0;
      background:rgba(251,248,241,.94);
      border:1px solid rgba(98,103,90,.28);
      box-shadow:var(--shadow);
      display:grid;
      grid-template-columns:.9fr 1.1fr;
      gap:0;
    }
    .menu-feature{
      min-height:360px;
      background:
        linear-gradient(135deg,rgba(63,90,45,.28),rgba(246,240,231,.28)),
        url('assets/template-tests/flower-background-template-1.jpg') center center/cover no-repeat;
      border-right:1px solid rgba(98,103,90,.22);
      position:relative;
    }
    .menu-feature-card{
      position:absolute;
      left:32px;
      bottom:32px;
      width:min(300px,72%);
      min-height:130px;
      background:rgba(251,248,241,.84);
      border-left:6px solid var(--sage-deep);
      padding:24px;
    }
    .placeholder-title{height:26px;background:rgba(29,29,29,.18);width:72%;margin-bottom:16px}
    .placeholder-line{height:8px;background:rgba(29,29,29,.12);width:100%;margin-bottom:9px}
    .placeholder-line.short{width:62%}

    .menu-links{
      padding:34px clamp(24px,4vw,54px);
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px 18px;
      align-content:center;
    }
    .menu-item{
      min-height:74px;
      border-top:1px solid rgba(98,103,90,.30);
      padding:16px 0;
      display:grid;
      grid-template-columns:auto 1fr;
      gap:14px;
      align-items:start;
    }
    .menu-number{
      width:28px;height:28px;
      border-radius:50%;
      background:rgba(199,206,192,.65);
      border:1px solid rgba(98,103,90,.28);
    }
    .menu-text{display:grid;gap:10px;padding-top:3px}
    .menu-text .main{height:12px;background:rgba(29,29,29,.24);width:78%}
    .menu-text .sub{height:7px;background:rgba(29,29,29,.10);width:92%}

    .page-preview{
      width:min(1180px,100%);
      margin:44px auto 0;
      min-height:520px;
      background:rgba(251,248,241,.62);
      border:1px solid rgba(98,103,90,.16);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:50px;
    }
    .preview-card{
      width:min(760px,100%);
      min-height:300px;
      background:rgba(251,248,241,.84);
      border-left:10px solid var(--sage-deep);
      padding:50px;
      box-shadow:var(--shadow);
    }
    .preview-title{height:64px;background:rgba(29,29,29,.14);width:70%;margin-bottom:28px}
    .preview-lines{display:grid;gap:12px;width:86%}
    .preview-lines span{height:10px;background:rgba(29,29,29,.10)}
    .preview-lines span:nth-child(3){width:72%}

    @media(max-width:780px){
      .page{padding:14px 10px 60px}
      .announcement{font-size:10px;min-height:30px;padding:6px 12px;letter-spacing:.08em}
      .main-bar{min-height:72px;grid-template-columns:1fr auto 1fr;padding:12px 14px}
      .logo-mark{width:62px;height:62px}
      .nav-pill{min-width:64px;height:34px;padding:0 12px;font-size:10px;letter-spacing:.10em}
      .left-actions .nav-pill:not(.menu-pill){display:none}
      .book-pill{min-width:82px}
      .quick-row{overflow:auto;justify-content:flex-start;padding:0 12px 12px;scrollbar-width:none}
      .quick-chip{height:30px;font-size:9px;min-width:max-content}
      .menu-panel{grid-template-columns:1fr;margin-top:14px}
      .menu-feature{min-height:230px;border-right:0;border-bottom:1px solid rgba(98,103,90,.22)}
      .menu-feature-card{left:20px;bottom:20px;width:72%;padding:18px;min-height:105px}
      .menu-links{grid-template-columns:1fr;padding:24px 26px;gap:4px}
      .menu-item{min-height:62px;padding:12px 0}
      .page-preview{margin-top:28px;padding:26px;min-height:420px}.preview-card{padding:32px 28px}.preview-title{height:48px;width:82%}
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="announcement">7am city message area</div>
    <header class="header-shell">
      <div class="main-bar">
        <div class="left-actions">
          <div class="nav-pill menu-pill">Menu</div>
          <div class="nav-pill">Services</div>
        </div>
        <div class="logo-mark"><div class="logo-inner"></div></div>
        <div class="right-actions">
          <div class="nav-pill">WhatsApp</div>
          <div class="nav-pill book-pill">Book</div>
        </div>
      </div>
      <div class="quick-row">
        <div class="quick-chip">Colour</div>
        <div class="quick-chip">Curls</div>
        <div class="quick-chip">Smoothing</div>
        <div class="quick-chip">Head Spa</div>
        <div class="quick-chip">Visit</div>
      </div>
    </header>

    <section class="menu-panel" aria-label="Open menu layout example">
      <div class="menu-feature">
        <div class="menu-feature-card">
          <div class="placeholder-title"></div>
          <div class="placeholder-line"></div>
          <div class="placeholder-line"></div>
          <div class="placeholder-line short"></div>
        </div>
      </div>
      <div class="menu-links">
        <div class="menu-item"><div class="menu-number"></div><div class="menu-text"><div class="main"></div><div class="sub"></div></div></div>
        <div class="menu-item"><div class="menu-number"></div><div class="menu-text"><div class="main"></div><div class="sub"></div></div></div>
        <div class="menu-item"><div class="menu-number"></div><div class="menu-text"><div class="main"></div><div class="sub"></div></div></div>
        <div class="menu-item"><div class="menu-number"></div><div class="menu-text"><div class="main"></div><div class="sub"></div></div></div>
        <div class="menu-item"><div class="menu-number"></div><div class="menu-text"><div class="main"></div><div class="sub"></div></div></div>
        <div class="menu-item"><div class="menu-number"></div><div class="menu-text"><div class="main"></div><div class="sub"></div></div></div>
        <div class="menu-item"><div class="menu-number"></div><div class="menu-text"><div class="main"></div><div class="sub"></div></div></div>
        <div class="menu-item"><div class="menu-number"></div><div class="menu-text"><div class="main"></div><div class="sub"></div></div></div>
      </div>
    </section>

    <section class="page-preview">
      <div class="preview-card">
        <div class="preview-title"></div>
        <div class="preview-lines"><span></span><span></span><span></span></div>
      </div>
    </section>
  </main>
</body>
</html>
