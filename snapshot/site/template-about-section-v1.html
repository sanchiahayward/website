<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Template — Section Layout V1</title>
  <style>
    :root{
      --sage:#c7cec0;
      --sage-dark:#62675a;
      --cream:#f6f0e7;
      --panel:#fffaf2;
      --ink:#1d1d1d;
      --muted:#696960;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif;}
    .top-strip{
      background:#111;
      color:var(--cream);
      min-height:44px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:10px 18px;
      font-family:Georgia,serif;
      font-size:.95rem;
      border-bottom:4px solid var(--sage-dark);
    }
    .template-header{
      background:var(--sage);
      padding:24px 28px 28px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:22px;
      border-bottom:2px solid var(--sage-dark);
    }
    .logo-placeholder{
      width:74px;
      height:74px;
      border:1px solid rgba(29,29,29,.45);
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:Georgia,serif;
      font-size:.72rem;
      letter-spacing:.14em;
      text-transform:uppercase;
      background:rgba(246,240,231,.38);
    }
    .nav-placeholder{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:18px 28px;
      font-size:.72rem;
      text-transform:uppercase;
      letter-spacing:.16em;
      color:#333;
    }
    .nav-placeholder span{border-bottom:1px solid rgba(29,29,29,.35);padding-bottom:5px}

    .section-template{
      position:relative;
      min-height:960px;
      padding:92px clamp(22px,5vw,70px) 110px;
      overflow:hidden;
      background:
        linear-gradient(90deg,rgba(246,240,231,.62),rgba(246,240,231,.24),rgba(246,240,231,.62)),
        radial-gradient(circle at 12% 30%,rgba(98,103,90,.24),transparent 28%),
        radial-gradient(circle at 84% 40%,rgba(168,177,164,.34),transparent 34%),
        linear-gradient(135deg,#eaded0,#c7cec0 48%,#f6f0e7);
    }
    .section-template:before{
      content:"";
      position:absolute;
      inset:36% 0 auto 0;
      height:32%;
      background:rgba(168,177,164,.76);
      z-index:0;
    }
    .layout-card{
      position:relative;
      z-index:1;
      max-width:1180px;
      margin:0 auto;
      display:grid;
      grid-template-columns:1fr 1fr;
      background:rgba(246,240,231,.82);
      box-shadow:0 34px 90px rgba(29,29,29,.10);
    }
    .photo-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      grid-template-rows:370px 300px;
      min-height:670px;
    }
    .photo-box{
      min-height:100%;
      border:1px solid rgba(29,29,29,.16);
      background:
        linear-gradient(135deg,rgba(246,240,231,.42),rgba(199,206,192,.42)),
        repeating-linear-gradient(45deg,rgba(29,29,29,.05) 0 8px,transparent 8px 18px);
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:20px;
      color:rgba(29,29,29,.55);
      font-size:.72rem;
      letter-spacing:.16em;
      text-transform:uppercase;
    }
    .photo-box.large{grid-column:1/3;background-color:rgba(255,250,242,.35)}
    .copy-box{
      margin:clamp(42px,5vw,78px) clamp(26px,4vw,60px);
      padding:clamp(32px,4vw,56px);
      background:rgba(255,250,242,.90);
      box-shadow:0 24px 70px rgba(29,29,29,.11);
      align-self:start;
    }
    .kicker-placeholder{
      width:145px;height:12px;background:rgba(98,103,90,.45);margin-bottom:28px;
    }
    .heading-placeholder{
      height:118px;
      max-width:420px;
      background:linear-gradient(180deg,rgba(29,29,29,.88) 0 18px,transparent 18px 30px,rgba(29,29,29,.78) 30px 48px,transparent 48px 60px,rgba(29,29,29,.68) 60px 78px,transparent 78px 100%);
      margin-bottom:32px;
    }
    .line{height:10px;background:rgba(105,105,96,.38);margin:0 0 14px;border-radius:10px}
    .line.short{width:70%}.line.medium{width:86%}.line.tiny{width:52%}
    .quote-placeholder{
      margin:30px 0;
      padding:22px 0;
      border-top:1px solid rgba(98,103,90,.35);
      border-bottom:1px solid rgba(98,103,90,.35);
    }
    .quote-placeholder .line{height:14px;background:rgba(98,103,90,.48)}
    .small-panel{
      margin-top:28px;
      padding-top:24px;
      border-top:1px solid rgba(98,103,90,.38);
    }
    .button-placeholder{
      width:190px;height:42px;border:1px solid var(--ink);margin-top:24px;display:flex;align-items:center;justify-content:center;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(29,29,29,.62);
    }
    .template-label{
      position:absolute;
      left:24px;
      bottom:22px;
      z-index:2;
      font-size:.72rem;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:rgba(29,29,29,.55);
    }
    @media(max-width:900px){
      .section-template{padding:54px 16px 72px;min-height:auto}
      .layout-card{grid-template-columns:1fr}
      .photo-grid{grid-template-rows:280px 210px;min-height:auto}
      .copy-box{margin:0;padding:34px 26px}
      .template-header{padding:18px 16px 20px;gap:16px}
      .nav-placeholder{gap:12px 16px;font-size:.66rem}
    }
  </style>
</head>
<body>
  <div class="top-strip">TOP MESSAGE BAR PLACEHOLDER</div>
  <header class="template-header">
    <div class="logo-placeholder">Logo</div>
    <nav class="nav-placeholder" aria-label="Template navigation placeholders">
      <span>Link</span><span>Link</span><span>Link</span><span>Link</span><span>Link</span><span>Link</span>
    </nav>
  </header>

  <section class="section-template">
    <div class="layout-card">
      <div class="photo-grid">
        <div class="photo-box large">Large background / section photo placeholder</div>
        <div class="photo-box">Small photo placeholder</div>
        <div class="photo-box">Small photo placeholder</div>
      </div>
      <div class="copy-box">
        <div class="kicker-placeholder"></div>
        <div class="heading-placeholder"></div>
        <div class="line medium"></div>
        <div class="line"></div>
        <div class="line short"></div>
        <div class="quote-placeholder">
          <div class="line medium"></div>
          <div class="line tiny"></div>
        </div>
        <div class="line"></div>
        <div class="line medium"></div>
        <div class="line short"></div>
        <div class="small-panel">
          <div class="line tiny"></div>
          <div class="line medium"></div>
          <div class="line short"></div>
          <div class="button-placeholder">Button</div>
        </div>
      </div>
    </div>
    <div class="template-label">Blank template only — no real copy, no real photos</div>
  </section>
</body>
</html>
