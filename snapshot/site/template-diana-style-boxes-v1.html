<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blank Template</title>
  <style>
    :root{
      --sage:#9ca58f;
      --sage-dark:#6d7464;
      --cream:#f2eee3;
      --white:#f8f8f2;
      --line:rgba(35,35,35,.22);
      --photo:#c8c4ad;
      --photo-dark:#878d76;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#fff;font-family:Arial,Helvetica,sans-serif;color:transparent}
    .page{
      min-height:100vh;
      padding:70px 24px 90px;
      display:flex;
      justify-content:center;
      background:#fff;
    }
    .outer-card{
      width:min(760px,92vw);
      border-radius:48px;
      overflow:hidden;
      background:
        linear-gradient(90deg,rgba(18,31,18,.38),rgba(246,240,231,.08),rgba(18,31,18,.38)),
        url('assets/template-tests/flower-background-template-1.jpg') center center/cover no-repeat;
      padding:70px 70px 0;
      box-shadow:0 20px 70px rgba(0,0,0,.12);
    }
    .site-frame{
      width:100%;
      background:var(--cream);
      overflow:hidden;
      box-shadow:0 10px 34px rgba(0,0,0,.16);
    }
    .mini-nav{
      height:34px;
      background:#757a68;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      padding:0 22px;
      gap:18px;
    }
    .nav-left{display:flex;gap:12px;align-items:center}
    .nav-line{height:5px;width:34px;background:rgba(245,245,235,.45);border-radius:8px}
    .brand-mark{width:54px;height:8px;background:rgba(245,245,235,.62);border-radius:8px}
    .button-small{justify-self:end;width:64px;height:18px;border-radius:4px;background:rgba(245,245,235,.72)}

    .hero{
      position:relative;
      height:270px;
      display:grid;
      grid-template-columns:1fr 1fr;
      background:var(--photo);
    }
    .hero-photo-left{
      background:
        repeating-linear-gradient(135deg,rgba(70,80,60,.28) 0 18px,rgba(255,255,255,.08) 18px 36px),
        linear-gradient(140deg,#78806d,#c5c0a7);
    }
    .hero-photo-right{
      background:
        radial-gradient(circle at 70% 28%,rgba(255,255,255,.25),transparent 18%),
        linear-gradient(140deg,#9d9b76,#6d7a5a);
    }
    .hero-overlay{
      position:absolute;
      left:50%;top:50%;
      transform:translate(-50%,-42%);
      width:44%;
      min-height:150px;
      background:var(--cream);
      box-shadow:0 12px 28px rgba(0,0,0,.12);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:26px;
    }
    .overlay-title{width:78%;height:58px;background:rgba(70,70,60,.22);margin-bottom:18px}
    .overlay-lines{width:82%;display:grid;gap:6px;margin-bottom:18px}
    .overlay-lines span{height:5px;background:rgba(70,70,60,.18)}
    .overlay-button{width:92px;height:25px;border-radius:4px;background:rgba(156,165,143,.58)}

    .quote-band{
      min-height:220px;
      background:var(--sage);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:54px 70px;
    }
    .quote-box{width:68%;display:grid;gap:10px}
    .quote-line{height:14px;background:rgba(248,248,242,.48);border-radius:12px}
    .quote-line.short{width:82%;justify-self:center}

    .grid-section{
      display:grid;
      grid-template-columns:1fr 1fr;
      background:var(--white);
    }
    .photo-block{
      min-height:300px;
      background:
        radial-gradient(circle at 40% 36%,rgba(255,255,255,.25),transparent 20%),
        linear-gradient(135deg,#8b9273,#c8c4ad);
      border:1px solid rgba(255,255,255,.18);
    }
    .text-block{
      min-height:300px;
      background:var(--white);
      padding:54px 52px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }
    .circle{width:82px;height:82px;border-radius:50%;background:linear-gradient(135deg,#99a088,#e1ddcf);margin:0 0 34px}
    .heading-small{width:60%;height:30px;background:rgba(70,70,60,.22);margin-bottom:18px}
    .body-lines{display:grid;gap:8px;width:82%}
    .body-lines span{height:7px;background:rgba(70,70,60,.16)}
    .body-lines span.short{width:68%}
    .story-block{background:var(--cream)}
    .story-block .heading-small{width:42%}
    .photo-block.bottom{background:linear-gradient(135deg,#bdc09b,#7e8b65)}

    @media(max-width:760px){
      .page{padding:28px 10px 54px}
      .outer-card{width:96vw;border-radius:34px;padding:38px 22px 0}
      .mini-nav{height:30px;padding:0 12px}.nav-left{gap:7px}.nav-line{width:24px}.button-small{width:48px}
      .hero{height:230px}.hero-overlay{width:62%;min-height:132px;padding:18px}.overlay-title{height:48px}
      .quote-band{min-height:180px;padding:42px 28px}.quote-box{width:90%}
      .grid-section{grid-template-columns:1fr}.photo-block,.text-block{min-height:250px}.text-block{padding:38px 34px}
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="outer-card">
      <div class="site-frame">
        <div class="mini-nav">
          <div class="nav-left"><span class="nav-line"></span><span class="nav-line"></span><span class="nav-line"></span><span class="nav-line"></span></div>
          <div class="brand-mark"></div>
          <div class="button-small"></div>
        </div>
        <section class="hero">
          <div class="hero-photo-left"></div>
          <div class="hero-photo-right"></div>
          <div class="hero-overlay">
            <div class="overlay-title"></div>
            <div class="overlay-lines"><span></span><span></span><span></span></div>
            <div class="overlay-button"></div>
          </div>
        </section>
        <section class="quote-band">
          <div class="quote-box"><div class="quote-line"></div><div class="quote-line"></div><div class="quote-line short"></div></div>
        </section>
        <section class="grid-section">
          <div class="photo-block"></div>
          <div class="text-block">
            <div class="circle"></div>
            <div class="heading-small"></div>
            <div class="body-lines"><span></span><span></span><span></span><span class="short"></span></div>
          </div>
          <div class="text-block story-block">
            <div class="heading-small"></div>
            <div class="body-lines"><span></span><span></span><span></span><span></span><span class="short"></span></div>
          </div>
          <div class="photo-block bottom"></div>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
