<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title></title>
  <style>
    :root{
      --green:#c7cec0;
      --green-dark:#62675a;
      --cream:#f6f0e7;
      --panel:#fbf7ed;
      --black:#101010;
      --line:rgba(29,29,29,.34);
      --soft:rgba(98,103,90,.22);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--cream)}
    body{font-family:Arial,Helvetica,sans-serif;color:transparent}

    .top-device-space{height:34px;background:#b8c1b6}
    .thin-strip{height:12px;background:#0d0d0d;border-top:1px solid #6b7765;border-bottom:1px solid #6b7765}
    .black-bar{height:54px;background:var(--black);border-bottom:4px solid var(--green-dark)}
    .green-header{
      height:204px;
      background:var(--green);
      border-bottom:2px solid rgba(98,103,90,.55);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:28px;
      padding:24px 28px;
    }
    .logo-box{width:74px;height:74px;border:1px solid var(--line);background:rgba(246,240,231,.22)}
    .nav-row{display:flex;flex-wrap:wrap;justify-content:center;gap:20px 30px;width:min(1000px,86vw)}
    .nav-line{width:70px;height:8px;background:rgba(29,29,29,.38)}
    .nav-row.second{width:min(640px,80vw)}

    .section{
      position:relative;
      min-height:880px;
      padding:0 clamp(26px,8vw,112px) 110px;
      overflow:hidden;
      background:
        linear-gradient(90deg,rgba(18,31,18,.42),rgba(246,240,231,.10),rgba(18,31,18,.42)),
        url('assets/template-tests/flower-background-template-1.jpg') center center/cover no-repeat;
    }
    .background-left,.background-right{
      position:absolute;top:0;bottom:0;width:18%;background:rgba(29,29,29,.16);filter:blur(.3px)
    }
    .background-left{left:0}.background-right{right:0}
    .main-panel{
      position:relative;
      z-index:2;
      width:min(1070px,100%);
      min-height:720px;
      margin:0 auto;
      background:rgba(251,247,237,.94);
      display:grid;
      grid-template-columns:1.02fr .98fr;
      gap:0;
      box-shadow:0 24px 70px rgba(29,29,29,.10);
    }
    .left-box{padding:0 clamp(32px,5vw,64px) 56px;background:rgba(251,247,237,.74)}
    .heading-block{width:74%;height:170px;margin:0 0 34px;background:rgba(98,103,90,.18);border:1px solid rgba(98,103,90,.20)}
    .text-stack{display:grid;gap:12px;margin-bottom:30px;width:92%}
    .text-line{height:12px;background:rgba(29,29,29,.22)}
    .text-line.short{width:72%}.text-line.mid{width:86%}
    .quote-block{width:78%;height:120px;margin:26px 0 28px;background:rgba(98,103,90,.20);border-left:4px solid rgba(98,103,90,.34)}
    .bottom-copy{display:grid;gap:12px;width:86%}
    .right-box{padding:0 clamp(24px,3.8vw,52px) 0 0;background:transparent;display:flex;align-items:flex-start;justify-content:center}
    .image-box{width:100%;height:400px;margin-top:0;background:rgba(199,206,192,.36);border:1px solid rgba(98,103,90,.32)}

    @media(max-width:900px){
      .top-device-space{height:26px}.black-bar{height:48px}.green-header{height:190px;gap:20px}
      .section{padding:0 18px 72px;min-height:auto}
      .main-panel{grid-template-columns:1fr;min-height:auto}
      .left-box{padding:0 30px 42px}.heading-block{width:84%;height:145px}.quote-block{width:88%}
      .right-box{padding:0 30px 40px}.image-box{height:320px}
    }
  </style>
</head>
<body>
  <div class="top-device-space"></div>
  <div class="thin-strip"></div>
  <div class="black-bar"></div>
  <header class="green-header">
    <div class="logo-box"></div>
    <div class="nav-row">
      <div class="nav-line"></div><div class="nav-line"></div><div class="nav-line"></div><div class="nav-line"></div><div class="nav-line"></div><div class="nav-line"></div><div class="nav-line"></div><div class="nav-line"></div>
    </div>
    <div class="nav-row second">
      <div class="nav-line"></div><div class="nav-line"></div><div class="nav-line"></div><div class="nav-line"></div><div class="nav-line"></div>
    </div>
  </header>
  <section class="section">
    <div class="background-left"></div>
    <div class="background-right"></div>
    <div class="main-panel">
      <div class="left-box">
        <div class="heading-block"></div>
        <div class="text-stack">
          <div class="text-line mid"></div><div class="text-line"></div><div class="text-line"></div><div class="text-line short"></div>
          <div class="text-line mid"></div><div class="text-line"></div><div class="text-line"></div><div class="text-line short"></div>
        </div>
        <div class="quote-block"></div>
        <div class="bottom-copy">
          <div class="text-line mid"></div><div class="text-line"></div><div class="text-line short"></div>
        </div>
      </div>
      <div class="right-box"><div class="image-box"></div></div>
    </div>
  </section>
</body>
</html>
