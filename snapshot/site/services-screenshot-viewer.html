<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Sanchia Hair — Earlier Services Screenshots</title>
  <style>
    body{margin:0;background:#f6f0e7;color:#151610;font-family:Arial,sans-serif;}
    .wrap{max-width:1100px;margin:0 auto;padding:24px;}
    h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:-.04em;font-size:clamp(2rem,5vw,3.8rem);margin:.2em 0 .4em;}
    p{max-width:70ch;line-height:1.6;color:#4f5049;}
    .note{background:#fff;border:1px solid rgba(63,90,45,.25);padding:14px 16px;margin:18px 0 24px;border-left:6px solid #3f5a2d;}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;}
    figure{margin:0;background:#fff;padding:10px;border:1px solid rgba(63,90,45,.18);box-shadow:0 8px 30px rgba(0,0,0,.05);}
    img{display:block;width:100%;height:auto;border:1px solid rgba(0,0,0,.08);}
    figcaption{font-size:.95rem;padding:10px 6px 4px;color:#1d1d1d;font-weight:700;}
    .small{font-size:.88rem;color:#62675a;font-weight:400;}
  </style>
</head>

      <figure>

      </figure>

</html>
