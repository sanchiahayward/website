<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sanchia Hair — Mirrored Ombré Watermark Test Only</title>
<style>
  :root{
    --cream:#fbf9f5;
    --linen:#f3eee8;
    --warm-beige:#dfdbd6;
    --sage:#a8b1a4;
    --deep-sage:#62675a;
    --ink:#1d1d1d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{overflow-x:hidden;background:var(--deep-sage);}

  /* Background-only test page: no layout, no boxes, no photos, no navigation */
  .background-test{
    position:relative;
    min-height:3200px;
    overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 49%, rgba(255,255,255,.96) 0%, rgba(251,249,245,.88) 21%, rgba(243,238,232,.58) 34%, transparent 48%),
      linear-gradient(180deg,
        #4f554a 0%,
        #62675a 8%,
        #7d8778 20%,
        #a8b1a4 33%,
        #d9ddd3 42%,
        #fbf9f5 49%,
        #fbf9f5 53%,
        #d9ddd3 60%,
        #a8b1a4 70%,
        #7d8778 82%,
        #62675a 92%,
        #4f554a 100%);
  }

  .background-test::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:0;
    background:
      linear-gradient(180deg,
        rgba(29,29,29,.20) 0%,
        rgba(29,29,29,.08) 15%,
        transparent 36%,
        rgba(255,255,255,.34) 47%,
        rgba(255,255,255,.34) 54%,
        transparent 65%,
        rgba(29,29,29,.08) 85%,
        rgba(29,29,29,.22) 100%),
      radial-gradient(ellipse at 50% 2%, rgba(255,255,255,.10), transparent 34%),
      radial-gradient(ellipse at 50% 98%, rgba(255,255,255,.10), transparent 34%);
  }

  .background-test::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:4;
    background:
      linear-gradient(90deg, rgba(29,29,29,.10), transparent 16%, transparent 84%, rgba(29,29,29,.10)),
      radial-gradient(ellipse at 50% 50%, rgba(255,255,255,.30), transparent 37%);
  }

  .watermark-field{
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
  }

  .watermark{
    position:absolute;
    width:clamp(320px,34vw,620px);
    aspect-ratio:1001/674;
    transform-origin:center;
  }
  .watermark img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    filter:grayscale(1) sepia(.12) saturate(.72) hue-rotate(50deg) contrast(.92);
  }
  .watermark.dark-area img{
    filter:grayscale(1) brightness(2.65) contrast(.78) opacity(.95);
  }

  .section-name{
    position:absolute;
    left:50%;
    top:53%;
    transform:translate(-50%,-50%);
    width:54%;
    font-family:Inter,"Work Sans",Arial,sans-serif;
    font-size:clamp(.46rem,.68vw,.78rem);
    font-weight:600;
    letter-spacing:.32em;
    line-height:1.55;
    text-align:center;
    text-transform:uppercase;
    color:#62675a;
  }
  .dark-area .section-name{color:rgba(251,249,245,.82);}
  .section-name.long{font-size:clamp(.36rem,.54vw,.64rem);letter-spacing:.20em;line-height:1.45;width:61%;}

  /* Controlled editorial placement — not scattered */
  .wm-top-left{left:-7%;top:3%;opacity:.18;transform:rotate(-10deg);}
  .wm-top-right{right:-5%;top:5%;opacity:.16;transform:rotate(10deg);}
  .wm-mid-left{left:-10%;top:38%;opacity:.115;transform:rotate(-90deg);}
  .wm-mid-right{right:-10%;top:39%;opacity:.115;transform:rotate(90deg);}
  .wm-centre{left:50%;top:49%;opacity:.10;transform:translate(-50%,-50%) scale(1.15);}
  .wm-bottom-left{left:-5%;bottom:5%;opacity:.15;transform:rotate(9deg);}
  .wm-bottom-right{right:-7%;bottom:3%;opacity:.18;transform:rotate(-9deg);}

  @media(max-width:900px){
    .background-test{min-height:2900px;}
    .watermark{width:360px;}
    .wm-top-left{left:-120px;top:3%;}
    .wm-top-right{right:-135px;top:9%;}
    .wm-mid-left{left:-160px;top:38%;}
    .wm-mid-right{right:-160px;top:40%;}
    .wm-centre{width:410px;}
    .wm-bottom-left{left:-135px;}
    .wm-bottom-right{right:-135px;}
  }
</style>
</head>
<body>
  <main class="background-test" aria-label="Mirrored ombré background-only watermark test">
    <div class="watermark-field" aria-hidden="true">
      <div class="watermark dark-area wm-top-left"><img src="assets/onedrive-logo-candidates/Secondary-Logo-Black-no-tagline.png" alt=""><div class="section-name">Blondes</div></div>
      <div class="watermark dark-area wm-top-right"><img src="assets/onedrive-logo-candidates/Secondary-Logo-Black-no-tagline.png" alt=""><div class="section-name">Brunettes</div></div>

      <div class="watermark wm-mid-left"><img src="assets/onedrive-logo-candidates/Secondary-Logo-Sage-no-tagline.png" alt=""><div class="section-name">Curly Hair</div></div>
      <div class="watermark wm-mid-right"><img src="assets/onedrive-logo-candidates/Secondary-Logo-Sage-no-tagline.png" alt=""><div class="section-name long">Cutting<br>&amp; Styling</div></div>
      <div class="watermark wm-centre"><img src="assets/onedrive-logo-candidates/Secondary-Logo-Sage-no-tagline.png" alt=""><div class="section-name">Red &amp;<br>Copper</div></div>

      <div class="watermark dark-area wm-bottom-left"><img src="assets/onedrive-logo-candidates/Secondary-Logo-Black-no-tagline.png" alt=""><div class="section-name long">QiQi<br>Smoothing<br>Hair Control</div></div>
      <div class="watermark dark-area wm-bottom-right"><img src="assets/onedrive-logo-candidates/Secondary-Logo-Black-no-tagline.png" alt=""><div class="section-name long">Modern Perms<br>Beach Waves</div></div>
    </div>
  </main>
</body>
</html>
