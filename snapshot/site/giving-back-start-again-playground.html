<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sanchia Hair — Clean Evie Foliage Playground</title>
  <style>
    :root{
      --sage:#c5d0bb;
      --sage-deep:#9faf91;
      --cream:#f6f0e7;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:linear-gradient(180deg,var(--sage),#d8dfcf 44%,var(--cream));}
    body{overflow-x:hidden;}
    .clean-evie-stage{
      position:relative;
      min-height:260vh;
      overflow:hidden;
      background:
        radial-gradient(ellipse at 50% 16%,rgba(190,204,179,.90) 0%,rgba(190,204,179,.62) 30%,rgba(197,208,187,.22) 58%,rgba(197,208,187,0) 78%),
        linear-gradient(90deg,rgba(159,175,145,.58) 0%,rgba(190,204,179,.50) 18%,rgba(190,204,179,.92) 36%,rgba(190,204,179,.98) 50%,rgba(190,204,179,.92) 64%,rgba(190,204,179,.50) 82%,rgba(159,175,145,.58) 100%),
        linear-gradient(180deg,rgba(197,208,187,.98),rgba(218,224,210,.86) 42%,rgba(246,240,231,.96));
    }
    .clean-evie-stage::before,
    .clean-evie-stage::after{
      content:"";
      position:absolute;
      top:calc(80vw);
      bottom:0;
      width:clamp(150px,24vw,420px);
      background-position:center top;
      background-size:100% auto;
      background-repeat:repeat-y;
      opacity:1;
      mix-blend-mode:normal;
      filter:contrast(1.12) saturate(1.08);
      pointer-events:none;
      z-index:0;
      -webkit-mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.26) 6%,rgba(0,0,0,.68) 16%,rgba(0,0,0,.92) 30%,#000 44%);
      mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.26) 6%,rgba(0,0,0,.68) 16%,rgba(0,0,0,.92) 30%,#000 44%);
    }
    .clean-evie-stage::before{
      left:0;
      background-image:url('assets/giving-back/source-f1-columns/left-column.png');
      -webkit-mask-image:
        linear-gradient(180deg,transparent 0%,rgba(0,0,0,.50) 8%,#000 18%,#000 100%),
        linear-gradient(90deg,#000 0%,#000 52%,rgba(0,0,0,.50) 76%,transparent 100%);
      mask-image:
        linear-gradient(180deg,transparent 0%,rgba(0,0,0,.50) 8%,#000 18%,#000 100%),
        linear-gradient(90deg,#000 0%,#000 52%,rgba(0,0,0,.50) 76%,transparent 100%);
      -webkit-mask-composite:source-in;
      mask-composite:intersect;
    }
    .clean-evie-stage::after{
      right:0;
      background-image:url('assets/giving-back/source-f1-columns/right-column.png');
      transform:none;
      -webkit-mask-image:
        linear-gradient(180deg,transparent 0%,rgba(0,0,0,.50) 8%,#000 18%,#000 100%),
        linear-gradient(270deg,#000 0%,#000 52%,rgba(0,0,0,.50) 76%,transparent 100%);
      mask-image:
        linear-gradient(180deg,transparent 0%,rgba(0,0,0,.50) 8%,#000 18%,#000 100%),
        linear-gradient(270deg,#000 0%,#000 52%,rgba(0,0,0,.50) 76%,transparent 100%);
      -webkit-mask-composite:source-in;
      mask-composite:intersect;
    }
    .clean-evie-photo{
      position:relative;
      z-index:1;
      width:100vw;
      margin:0 auto;
      min-height:clamp(560px,62vw,760px);
      display:flex;
      align-items:flex-start;
      justify-content:center;
    }
    .clean-evie-photo::after{
      content:"";
      position:absolute;
      top:0;
      bottom:0;
      left:92.4vw;
      width:5.4vw;
      z-index:2;
      pointer-events:none;
      background:linear-gradient(90deg,rgba(190,204,179,0) 0%,rgba(190,204,179,.74) 38%,rgba(190,204,179,.86) 50%,rgba(190,204,179,.74) 62%,rgba(190,204,179,0) 100%);
      mix-blend-mode:color;
    }
    .clean-evie-photo img{
      display:block;
      width:112vw;
      max-width:none;
      height:auto;
      object-fit:contain;
      object-position:center top;
      filter:none;
      opacity:1;
      -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.45) 7%,#000 16%,#000 84%,rgba(0,0,0,.45) 93%,transparent 100%),linear-gradient(180deg,#000 0%,#000 72%,rgba(0,0,0,.58) 88%,transparent 100%);
      mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.45) 7%,#000 16%,#000 84%,rgba(0,0,0,.45) 93%,transparent 100%),linear-gradient(180deg,#000 0%,#000 72%,rgba(0,0,0,.58) 88%,transparent 100%);
    }
    .horizontal-join-softener{
      position:absolute;
      left:0;
      right:0;
      top:calc(80vw);
      height:clamp(170px,21vw,290px);
      transform:translateY(-58%);
      z-index:2;
      pointer-events:none;
      background:linear-gradient(180deg,rgba(190,204,179,0) 0%,rgba(190,204,179,.16) 14%,rgba(190,204,179,.64) 34%,rgba(190,204,179,.94) 52%,rgba(190,204,179,.72) 68%,rgba(190,204,179,.20) 88%,rgba(190,204,179,0) 100%);
    }
    .soft-bottom-fade{
      position:absolute;
      left:0;
      right:0;
      top:calc(88.6vw);
      height:120vh;
      z-index:0;
      pointer-events:none;
      background:
        linear-gradient(90deg,transparent 0%,transparent 18%,rgba(190,204,179,.46) 32%,rgba(190,204,179,.90) 50%,rgba(190,204,179,.46) 68%,transparent 82%,transparent 100%),
        radial-gradient(ellipse at 50% 0%,rgba(190,204,179,.54) 0%,rgba(190,204,179,.24) 34%,rgba(190,204,179,0) 68%);
    }
    @media(max-width:760px){
      .clean-evie-stage::before,
      .clean-evie-stage::after{width:clamp(112px,31vw,210px);opacity:1;top:calc(99.7vw);}
      .clean-evie-photo{min-height:clamp(420px,88vw,760px);}
      .clean-evie-photo img{width:126vw;max-width:none;}
      .soft-bottom-fade{top:calc(99.7vw);}
    }
  </style>
</head>
<body>
  <main class="clean-evie-stage" aria-label="Clean Evie foliage playground">
    <div class="clean-evie-photo">
      <img src="assets/approved/APPROVED-Evie-green-fade-ear-paw-final.jpg" alt="">
    </div>
    <div class="horizontal-join-softener" aria-hidden="true"></div>
    <div class="soft-bottom-fade" aria-hidden="true"></div>
  </main>
</body>
</html>
